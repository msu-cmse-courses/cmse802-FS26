name: Site Link Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build the Jekyll site
        run: bundle exec jekyll build --source . --trace

      - name: Serve the built site with Jekyll
        run: |
          bundle exec jekyll serve --detach --host 127.0.0.1 --port 4000 --baseurl '/cmse802-FS26'
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail --silent --show-error http://127.0.0.1:4000/cmse802-FS26/ >/dev/null

      - name: Check site links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --base-url 'http://127.0.0.1:4000/cmse802-FS26/'
            http://127.0.0.1:4000/cmse802-FS26/
