name: Site Link Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build and serve the Jekyll site locally
        run: |
          bundle exec jekyll build --source . --trace
          bundle exec jekyll serve --detach --source . --host 127.0.0.1 --port 4000

      - name: Check site links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --base 'http://127.0.0.1:4000/' 'http://127.0.0.1:4000/'
