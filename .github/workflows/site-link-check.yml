name: Site Link Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build the Jekyll site
        run: bundle exec jekyll build --source . --trace

      - name: Serve the built site locally
        run: |
          python3 -m http.server 4000 --directory _site >/tmp/cmse802-site.log 2>&1 &
          curl -I http://127.0.0.1:4000/

      - name: Check site links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --base-url 'http://127.0.0.1:4000/' http://127.0.0.1:4000/
