name: Site Link Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build the Jekyll site
        run: bundle exec jekyll build --source . --trace

      - name: Check generated site for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline --base 'https://colbrydi.github.io/cmse802-FS26/' _site
